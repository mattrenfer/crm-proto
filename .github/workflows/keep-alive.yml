name: Keep Supabase awake

on:
    schedule:
        - cron: '0 12 * * 1,4'
    workflow_dispatch:

jobs:
    ping:
        runs-on: ubuntu-latest
        steps:
            - name: Query the database
              run: |
                  curl --fail --silent --show-error \
                    "${{ secrets.SUPABASE_URL }}/rest/v1/clients?select=id&limit=1" \
                    -H "apikey: ${{ secrets.SUPABASE_ANON_KEY }}"
