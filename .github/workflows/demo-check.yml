name: Check the demo works

# The demo is what most visitors try first, and its failures are silent: the visitor sees
# "demo unavailable" or an empty dashboard and leaves. This walks the same path a visitor
# does, every hour, and fails (so GitHub emails the owner) if any step breaks.
#
# One run proves: the site is up, Supabase is awake, the demo sign-in works (credentials and
# service role key in Vercel), RLS lets the demo see its rows, and the nightly reset left data.
# It uses only the public site, so it needs no secrets.
on:
    schedule:
        - cron: '17 * * * *' # every hour, off the top of the hour when GitHub is busiest
    workflow_dispatch:

jobs:
    check:
        runs-on: ubuntu-latest
        timeout-minutes: 5
        env:
            SITE: https://handful.matthewrenfer.com
        steps:
            - name: Sign in to the demo
              run: |
                  # Like clicking "Try the demo": a POST that should redirect (303) to the dashboard
                  result=$(curl --silent --show-error --max-time 30 --output /dev/null \
                    --cookie-jar jar.txt --request POST \
                    --write-out '%{http_code} %{redirect_url}' "$SITE/api/demo")
                  echo "Got: $result"
                  if [ "$result" != "303 $SITE/" ]; then
                    echo "::error::The demo sign-in didn't reach the dashboard (expected '303 $SITE/')"
                    exit 1
                  fi

            - name: Load the dashboard as the demo user
              run: |
                  status=$(curl --silent --show-error --max-time 30 --cookie jar.txt \
                    --output dashboard.html --write-out '%{http_code}' "$SITE/")
                  echo "Got: $status"
                  if [ "$status" != "200" ]; then
                    echo "::error::The dashboard returned $status"
                    exit 1
                  fi
                  # Any one sample client from supabase/seed/demo.sql. Visitors can delete some
                  # during the day, so this only fails if the demo looks empty.
                  if ! grep -qE 'Dana Whitfield|Tom Okafor|Marcus Bell|Priya Nair|Elena Ruiz' dashboard.html; then
                    echo "::error::The dashboard shows none of the sample clients (database asleep, reset failed, or RLS)"
                    exit 1
                  fi
                  echo "The demo works."
